name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Ensure embedded web placeholder
        working-directory: backend
        run: |
          mkdir -p web/dist
          touch web/dist/.gitkeep

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Download Go dependencies
        working-directory: backend
        run: go mod download

      - name: Run backend checks
        working-directory: backend
        run: bash check.sh

      - name: Build release package
        env:
          VERSION: ${{ github.ref_name }}
        run: bash build-release.sh "$VERSION"

      - name: Package release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd release
          tar -czf "game-release-${VERSION}-linux-amd64.tar.gz" "game-release-${VERSION}"
          zip -r "game-release-${VERSION}-linux-amd64.zip" "game-release-${VERSION}"
          sha256sum "game-release-${VERSION}-linux-amd64.tar.gz" "game-release-${VERSION}-linux-amd64.zip" > "game-release-${VERSION}-checksums.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/game-release-${{ github.ref_name }}-linux-amd64.tar.gz
            release/game-release-${{ github.ref_name }}-linux-amd64.zip
            release/game-release-${{ github.ref_name }}-checksums.txt

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-release
    environment: DOCKERHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hao0114
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hao0114/gameatlas
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
